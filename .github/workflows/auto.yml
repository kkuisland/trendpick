# 하루 3회 자동 이슈 체크 → 선별 → 초안/발행 → 배포
#
# 실행 시각 (KST): 07:00 / 12:30 / 19:00
#   - 아침: 밤사이 이슈 + 이벤트 D-Day 선점
#   - 점심: 오전 발생 이슈 (검색 피크 직전)
#   - 저녁: 하루 결산 이슈 + 영문(글로벌) 콘텐츠
#
# 가드: 회당 1개, 하루 최대 automation.maxPostsPerDay 개, 민감 주제 자동 제외,
#       점수 미달이면 아무것도 쓰지 않음. autoGenerate=false 면 수집·기획만 수행.
name: auto-publish

on:
  schedule:
    - cron: "0 22 * * *"  # KST 07:00
    - cron: "30 3 * * *"  # KST 12:30
    - cron: "0 10 * * *"  # KST 19:00
  workflow_dispatch:
    inputs:
      force:
        description: "강제 생성 (autoGenerate·일일 한도 무시)"
        type: boolean
        default: false
      locale:
        description: "생성 언어"
        type: choice
        options: [ko, en]
        default: ko
      topic:
        description: "주제 직접 지정 (비우면 자동 선별)"
        type: string
        default: ""
      category:
        description: "카테고리 (주제 지정 시)"
        type: string
        default: ""
      event:
        description: "이벤트 키 (data/events.json, 선택)"
        type: string
        default: ""

permissions:
  contents: write
  issues: write

concurrency:
  group: auto-publish
  cancel-in-progress: false

jobs:
  auto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: npm install --no-audit --no-fund

      # 저녁 회차는 영문 콘텐츠 우선 (해외 검색 유입 확장)
      - name: Decide locale
        id: loc
        run: |
          if [ -n "${{ inputs.locale }}" ]; then
            echo "locale=${{ inputs.locale }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 10 * * *" ]; then
            echo "locale=en" >> "$GITHUB_OUTPUT"
          else
            echo "locale=ko" >> "$GITHUB_OUTPUT"
          fi

      - name: Run auto routine
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          ARGS="--locale ${{ steps.loc.outputs.locale }}"
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          if [ -n "${{ inputs.topic }}" ]; then ARGS="$ARGS --topic \"${{ inputs.topic }}\""; fi
          if [ -n "${{ inputs.category }}" ]; then ARGS="$ARGS --category \"${{ inputs.category }}\""; fi
          if [ -n "${{ inputs.event }}" ]; then ARGS="$ARGS --event ${{ inputs.event }}"; fi
          echo "실행: node scripts/auto.mjs $ARGS"
          eval "node scripts/auto.mjs $ARGS"

      # 제휴 링크 점검: 자동 생성 가능한 건 만들고, 사람이 만들어야 하는 건 이슈로 요청
      # (GitHub 이 이슈 생성·수정 시 저장소 소유자에게 메일을 보낸다 — 별도 SMTP 설정 불필요)
      - name: Check affiliate links
        id: aff
        env:
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
          # SMTP 가 설정돼 있으면 메일로도 발송 (없으면 GitHub 이슈 알림만 사용)
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
        run: node scripts/affiliate-check.mjs --apply

      # 커밋을 푸시하면 Railway 가 자동으로 재빌드·배포한다 (ktrend.kr)
      - name: Commit generated content
        run: |
          git config user.name "ktrend-bot"
          git config user.email "actions@users.noreply.github.com"
          git add content data
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto run $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M') KST"
            git pull --rebase --autostash origin main
            git push
          else
            echo "새로 생성된 콘텐츠 없음 — 커밋 생략"
          fi

      # 요청할 항목이 있을 때만 이슈를 만들거나 갱신한다.
      # 같은 제목의 열린 이슈가 있으면 새로 만들지 않고 본문을 갱신해 메일 스팸을 막는다.
      - name: Request affiliate links via issue
        if: steps.aff.outputs.needs_request == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          TITLE="[제휴 링크 요청] 새 글에 필요한 쿠팡·트립닷컴 링크"
          # @멘션을 넣어야 GitHub 이 확실히 메일을 보낸다 (본문 수정만으로는 알림이 가지 않음)
          printf '@%s 아래 항목을 확인해 주세요.\n\n' "$OWNER" > /tmp/body.md
          cat data/affiliate-request.md >> /tmp/body.md

          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number,title \
            --jq "[.[] | select(.title == \"$TITLE\")][0].number")
          if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
            # 내용이 그대로면 아무것도 하지 않는다 (메일 스팸 방지)
            gh issue view "$EXISTING" --json body --jq .body > /tmp/old.md || true
            if diff -q <(tail -n +3 /tmp/body.md) <(tail -n +3 /tmp/old.md) >/dev/null 2>&1; then
              echo "요청 내용 변화 없음 — 알림 생략 (#$EXISTING)"
            else
              gh issue edit "$EXISTING" --body-file /tmp/body.md
              # 본문 수정은 알림이 가지 않으므로, 변경됐을 때만 댓글로 알린다
              gh issue comment "$EXISTING" --body "@$OWNER 요청 항목이 변경되었습니다. 본문을 확인해 주세요."
              echo "이슈 #$EXISTING 갱신 + 알림"
            fi
          else
            gh issue create --title "$TITLE" --body-file /tmp/body.md
          fi

      # 자동 발행이 켜져 있어도 보류된 글은 사람이 봐야 하므로 목록을 이슈로 띄운다
      - name: Check review queue
        id: review
        run: node scripts/review-queue.mjs

      - name: Notify review queue
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          TITLE="[검수 대기] 자동 발행 보류된 글"
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number,title \
            --jq "[.[] | select(.title == \"$TITLE\")][0].number")
          if [ "${{ steps.review.outputs.has_drafts }}" = "true" ]; then
            printf '@%s 확인해 주세요.\n\n' "$OWNER" > /tmp/rq.md
            cat data/review-queue.md >> /tmp/rq.md
            if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
              gh issue view "$EXISTING" --json body --jq .body > /tmp/rq_old.md || true
              if diff -q <(tail -n +3 /tmp/rq.md) <(tail -n +3 /tmp/rq_old.md) >/dev/null 2>&1; then
                echo "검수 목록 변화 없음 — 알림 생략 (#$EXISTING)"
              else
                gh issue edit "$EXISTING" --body-file /tmp/rq.md
                gh issue comment "$EXISTING" --body "@$OWNER 검수 대기 목록이 변경되었습니다."
              fi
            else
              gh issue create --title "$TITLE" --body-file /tmp/rq.md
            fi
          elif [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
            gh issue close "$EXISTING" --comment "검수 대기 중인 글이 모두 처리되어 자동으로 닫습니다."
          fi

      # 요청 항목이 모두 해결되면 열린 요청 이슈를 닫는다
      - name: Close affiliate request when resolved
        if: steps.aff.outputs.needs_request == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="[제휴 링크 요청] 새 글에 필요한 쿠팡·트립닷컴 링크"
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number,title \
            --jq "[.[] | select(.title == \"$TITLE\")][0].number")
          if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
            gh issue close "$EXISTING" --comment "요청하신 제휴 링크가 모두 연결되어 자동으로 닫습니다. 새로 필요한 링크가 생기면 다시 알려드립니다."
            echo "이슈 #$EXISTING 닫음"
          else
            echo "닫을 이슈 없음"
          fi
